<div class="reclamations-page">
  <div class="page-header">
    <div>
      <h1>📝 Mes Réclamations</h1>
      <p>Consultez et suivez vos réclamations</p>
    </div>
  </div>

  <div class="filters-bar">
    <select class="filter-select" [(ngModel)]="statusFilter">
      <option value="TOUS">Toutes</option>
      <option value="OUVERT">Ouvertes</option>
      <option value="FERME">Fermées</option>
    </select>
  </div>

  <div class="loading-state" *ngIf="loading" style="text-align: center; padding: 40px; color: #666;">
    Chargement...
  </div>

  <div class="table-card" *ngIf="!loading">
    <table class="data-table">
      <thead>
      <tr>
        <th>ID</th>
        <th>DATE</th>
        <th>PRODUIT</th>
        <th>DESCRIPTION</th>
        <th>STATUT</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let r of filteredReclamations">
        <td class="id-cell">REC-{{ r.id }}</td>
        <td>{{ r.date | date:'dd/MM/yyyy' }}</td>
        <td class="product-name">{{ r.produit?.nom }}</td>
        <td class="product-desc-cell">{{ r.description }}</td>
        <td>
          <span class="status-badge" [class.ouvert]="r.statut === 'OUVERT'" [class.ferme]="r.statut === 'FERME'">
            {{ r.statut }}
          </span>
        </td>
      </tr>
      <tr *ngIf="filteredReclamations.length === 0">
        <td colspan="5" class="empty-state" style="text-align: center; padding: 30px; color: #888;">Vous n'avez aucune réclamation</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
