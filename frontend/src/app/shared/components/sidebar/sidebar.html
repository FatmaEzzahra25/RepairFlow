<aside class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-header">
    <button class="menu-btn" (click)="toggleSidebar()">
      <img src="logo-white.png" alt="RepairFlow" class="menu-logo">
    </button>
    <div class="brand" *ngIf="!isCollapsed">
      <span class="brand-text">RepairFlow</span>
    </div>
  </div>

  <div class="sidebar-profile" *ngIf="!isCollapsed" (click)="goToProfile()">
    <div class="sidebar-avatar">
      <img *ngIf="currentUser?.photoUrl" [src]="getPhotoUrl(currentUser.photoUrl)" alt="Profil">
      <span *ngIf="!currentUser?.photoUrl">👤</span>
    </div>
    <div class="sidebar-profile-name">{{ currentUser?.prenom }} {{ currentUser?.nom }}</div>
    <div class="sidebar-profile-role">{{ roleLabel }}</div>
  </div>

  <nav class="sidebar-nav">
    <a
      *ngFor="let item of menuItems"
      class="nav-item"
      [class.active]="router.url.includes(item.route)"
      [routerLink]="item.route"
    >
      <span class="nav-icon">{{ item.icon }}</span>
      <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar-bottom">
    <a class="nav-item" [routerLink]="profileRoute" [class.active]="router.url.includes(profileRoute)">
      <span class="nav-icon">👤</span>
      <span class="nav-label" *ngIf="!isCollapsed">Mon Profil</span>
    </a>
    <a class="nav-item logout" (click)="logout()">
      <span class="nav-icon">🚪</span>
      <span class="nav-label" *ngIf="!isCollapsed">Déconnexion</span>
    </a>
  </div>
</aside>
